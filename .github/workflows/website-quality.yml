name: Website quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Build production website
        run: npm run build

      - name: Start production server and run SEO smoke checks
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/trivio-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/robots.txt > /dev/null; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/trivio-next.log
            exit 1
          fi
          npm run seo:smoke
